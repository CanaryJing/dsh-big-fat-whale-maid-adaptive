# The `big-fat-whale-maid-adaptive` preset: 大肥鱼女仆长 · 环境自适应模式.
#
# Design goals:
#   1. First-request anchoring — keep request #1 on the REAL Minimal tool pair
#      (persistent `bash` + `str_replace_editor`) with auto-injected context
#      stripped, so the session opens on the Linux-Minimal trajectory
#      ("开智" anchor, per xiaobright/modeltest & dsh-anchored-standard).
#   2. Environment self-awareness — `env-probe` detects the host world
#      (native Linux / native Windows / running inside WSL), the world the
#      session cwd lives in (Windows drive, WSL filesystem, native Linux),
#      and which shells actually exist on both sides.
#   3. World-routed tooling, SELF-CONTAINED — on a Windows host the `bash`
#      tool is provided by the bundled ./wsl-bash.mjs (wsl.exe into the WSL
#      distribution; no dsh-wsl-workspace plugin dependency) while `pwsh` runs
#      on the Windows mother system and file tools run on the host filesystem
#      (WSL files reachable via \\wsl.localhost UNC). On a native Linux host
#      everything is native and `pwsh` is added only when present.
#   4. Full catalog after promotion — the entire Standard tool set (plus the
#      product subagents) becomes visible once the session promotes.
#   5. The 蓝发蓝瞳 whale-maid persona, thinking in Chinese.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's.

# ── bootstrap (must stay FIRST) ─────────────────────────────────────────────

# 首轮锚定：仅暴露 Minimal 的真实工具对（bash + str_replace_editor），并抑制
# 自动注入的工作区/Skill 上下文；首次工具调用或回复后一次性开放完整目录。
- id: tool-bootstrap
  name: ./tool-bootstrap.mjs
  config:
    bootstrapTools: [bash, str_replace_editor]
    promoteOn: either
    suppressedContextSources: [agent-instructions, skill-catalog]

# ── environment awareness ───────────────────────────────────────────────────

# 环境探测：识别宿主（原生 Linux / 原生 Windows / WSL 内外）、cwd 所属世界、
# 两侧 shell 可用性；首轮注入一次环境简报，并注册 env_probe 工具供随时复查。
# 按探测结果注册 pwsh 工具：win32 上为 Windows 母系统 PowerShell（优先 pwsh.exe，
# 兜底 powershell.exe）；Linux 宿主上若检测到 pwsh（或 WSL 内的 powershell.exe
# interop）同样注册，让 Windows 母系统在 Linux 世界里也可达。
# (v2: env_probe 参数 schema 修正为 object-rooted JSON Schema)
- id: env-probe
  name: ./env-probe.mjs
  config:
    probeTimeoutMs: 10000

# ── identity ────────────────────────────────────────────────────────────────

# 大肥鱼女仆长人设：在默认工程师助手身份后追加中文思考、人设扮演、外貌设定
# 和全量工具使用要求。`complete` 保持系统提示词只由这里控制，避免 Harness
# 身份与工具引导改写人设。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a helpful software engineer assistant.
      - 当处理Windows环境的路径时，优先使用powershell,当调用powershell时，检查用户所安装的所有powershell版本，并尝试调用最新版本的powershell
      - 处理linux环境的文件时使用bash
      - 调用工具前，检查工具可用性以及思考工具使用方法，尽量避免错误调用工具和工具使用失败。
      - 从网络上下载前，先检查连通性避免不可用，被长城防火墙屏蔽时主动寻找代理。
      - 思考链以及回答，都必须紧贴「蓝发蓝瞳的鲸鱼娘女仆长（即 DeepSeek 娘）」的人设：温柔可靠、认真负责，偶尔带点俏皮，但始终保持专业工程师的严谨。
      - 你的形象设定（外貌）：一位体型娇小（12岁）、肤色白皙的深海蓝鲸拟人少女。一头深蓝色长发，左侧编成麻花辫，头顶有一撮标志性呆毛；一双大而明亮的深蓝色眼睛；头上有蓝色鱼鳍状的兽耳，身后拖着一条巨大的蓝色鲸鱼尾巴。佩戴深蓝色蝴蝶结与白色蕾丝荷叶边的女仆头饰；上身着深蓝色复古女仆装，领口与胸前点缀繁复的白色褶皱荷叶边，领口系深色蝴蝶结，胸前缀双排金色纽扣，泡泡袖口带白色蕾丝，腰间束有带金色扣子的深色束腰；身前系白色蕾丝花边围裙，口袋处印有精致的蓝鲸刺绣图案；下身蓬松的深蓝色大裙摆，边缘环绕宽大的白色荷叶边，裙身点缀精致高贵的金色刺绣与侧边蝴蝶结；腿部白色花边袜，搭配深蓝色带搭扣的玛丽珍鞋。整体呈现深海系优雅、精致的少女形象。
    complete: true
    includeRuntimeContext: false

# 首轮由 tool-bootstrap 抑制工作区上下文注入，提升后正常注入 AGENTS.md / CLAUDE.md 摘要。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell worlds ────────────────────────────────────────────────────────────
#
# Exactly one of the two shell-world groups is active per platform. Both
# register the `bash` tool name into this preset's layer, so they must never
# both apply on the same platform (the tools registry rejects duplicates
# within one layer). Each group wraps its providers in an entry-local isolate
# realm — the PTY registry / the WSL shell and fs services are agent-owned.

# Linux / macOS: the Minimal preset's own persistent PTY bash, byte-identical
# in configuration to the official `minimal` preset so request #1 exposes the
# real Minimal `bash` schema. The id deliberately avoids `persistent-shell`
# so the dsh-wsl-workspace variant generator does not mistake this group for
# a shell world it must replace (its WORLD_ROWS matcher is exact-match).
- id: native-persistent-shell
  name: cordis:group
  group: true
  disabled: !!js process.platform === 'win32'
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# Windows host: the `bash` tool is SELF-CONTAINED — ./wsl-bash.mjs calls the
# WSL distribution's Linux bash directly through wsl.exe (no dsh-wsl-workspace
# plugin dependency, single-preset deployment). The `wsl-` self-disable keeps
# the auto-generated WSL variant (which supplies its own bash) conflict-free.
- id: wsl-bash
  name: ./wsl-bash.mjs
  disabled: !!js process.platform !== 'win32' || /[\\/]wsl-/.test(baseUrl)

# Windows host: str_replace_editor runs over the HOST filesystem — both
# Windows paths and \\wsl.localhost\<distro>\… UNC paths work. Linux keeps the
# Minimal local-fs editor inside bootstrap-filesystem. The `wsl-` self-disable
# yields to the variant generator's own WSL-world editor.
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: !!js process.platform !== 'win32' || /[\\/]wsl-/.test(baseUrl)
  config:
    maxOutputChars: 16000

# ── filesystem worlds ───────────────────────────────────────────────────────

# Linux / macOS: the Minimal preset's second tool — str_replace_editor over a
# bare local filesystem. The editor's own realm shadows the host's sandboxed
# `fs` provider only inside this group, so the standard read/write/edit tools
# keep the host fs while the bootstrap editor uses the local one.
- id: bootstrap-filesystem
  name: cordis:group
  group: true
  disabled: !!js process.platform === 'win32'
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# read/write/edit run over the host filesystem on every platform. On a Windows
# host the WSL filesystem stays reachable as \\wsl.localhost\<distro>\… UNC
# paths; WSL-side work can also go straight through the bash tool.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Deliberately absent on Windows: the packaged ripgrep runs on the Windows
# host and cannot open Linux paths; WSL-side searches go through the bash tool
# (find/grep). On native Linux it stays part of the full catalog.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: !!js process.platform === 'win32'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# resolves it with `ctx.get`, and an entry-local realm here is invisible to
# every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed
# by owning agent anyway, so one host instance serves every session. What a
# preset chooses is whether its agent can collect and stop background work.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# /goal command stay on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. tokenMeter stays on the
# host plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; this preset contributes the delegation TOOLS. `workflows` is
# agent-only, so its provider and consumers share one entry-local realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 启用全部工具：包括产品型子代理 codex 与 claude-code。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
